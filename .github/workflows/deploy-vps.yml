# CI + déploiement automatique sur VPS (SSH + git).
#
# Réutilise les mêmes secrets que YogaOps :
#   VPS_SSH_PRIVATE_KEY  — clé privée PEM (recommandé)
#   VPS_SSH_PASSWORD     — mot de passe SSH (alternatif)
#   VPS_HOST             — IP du VPS (ex: 51.91.253.165)
#   VPS_USER             — utilisateur SSH (ex: ubuntu)
#
# Variables spécifiques Qadus (Settings → Variables) :
#   VPS_APP_DIR          — chemin sur le VPS (défaut: /var/www/qadus)
#   VPS_SSH_PORT         — port SSH (défaut: 22)
#
# Variables d'env runtime (à placer dans .env sur le VPS) :
#   SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_TO, PORT=3002

name: CI & déploiement VPS — Qadus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-vps-qadus-production
      cancel-in-progress: false

    steps:
      - name: Vérifier auth SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_PASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "${SSH_KEY:-}" ] && [ -z "${SSH_PASS:-}" ]; then
            echo "::error::Ajoutez VPS_SSH_PRIVATE_KEY ou VPS_SSH_PASSWORD dans les secrets GitHub."
            exit 1
          fi

      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST || '51.91.253.165' }}
          username: ${{ secrets.VPS_USER || vars.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: ${{ vars.VPS_SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="${{ vars.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              for CANDIDATE in /var/www/qadus /home/ubuntu/qadus /root/qadus; do
                if [ -d "$CANDIDATE/.git" ]; then
                  APP_DIR="$CANDIDATE"
                  break
                fi
              done
              APP_DIR="${APP_DIR:-/var/www/qadus}"
            fi
            echo "=== Dossier app : $APP_DIR ==="
            echo "=== Commit GitHub : ${{ github.sha }} ==="
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo mkdir -p "$APP_DIR"
              sudo chown "$(whoami):$(whoami)" "$APP_DIR"
              if [ -d "$APP_DIR" ] && [ "$(ls -A $APP_DIR)" ]; then
                cd "$APP_DIR"
                git init
                git remote add origin https://github.com/${{ github.repository }}.git
                git fetch origin main
                git checkout -f main
              else
                git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
              fi
            fi
            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git reset --hard "${{ github.sha }}"
            echo "=== Commit VPS après reset : $(git rev-parse HEAD) ==="
            bash scripts/vps-deploy.sh

      - name: Vérifier le contenu en production
        run: |
          echo "=== Vérification du numéro 06 67 25 08 85 sur https://www.qadus.fr/ ==="
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -sL --compressed --max-time 20 -H "Cache-Control: no-cache" "https://www.qadus.fr/?v=$(date +%s)" || true)
            if echo "$body" | grep -qE "06 67 25 08 85|0667250885|tel:\+33667250885|\+33667250885"; then
              echo "=== OK : nouvelle version déployée (tentative $attempt) ==="
              exit 0
            fi
            if echo "$body" | grep -qE "07 58 42 95 10|07 61 91 62 22"; then
              echo "tentative $attempt : ancienne version encore visible..."
            else
              echo "tentative $attempt : réponse inattendue"
            fi
            sleep 15
          done
          echo "::error::Le site public ne sert pas encore la nouvelle version. Vérifiez PM2 (port 3002) et nginx sur le VPS."
          echo "Sur le VPS : bash scripts/vps-diagnose.sh"
          exit 1

      - name: Vérifier qadus.fr accessible
        run: |
          echo "=== Vérification publique https://qadus.fr/ ==="
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://qadus.fr/ || echo "000")
            echo "tentative $attempt : HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
              echo "=== OK : qadus.fr accessible ==="
              exit 0
            fi
            sleep 10
          done
          echo "::warning::qadus.fr pas encore accessible (DNS en propagation ou SSL non configuré) — le déploiement sur le VPS est OK"
